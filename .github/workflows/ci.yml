name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel superseded runs for the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ESLint) + Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # pnpm version comes from the "packageManager" field in package.json.

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        # Every workspace package's vitest suite; the Workflows suite includes the module CSS contract test.
        # One package at a time, so the Workflows suite does not compete with the others for the runner's cores.
        run: pnpm --recursive --workspace-concurrency=1 test

      - name: Prove assistance traffic provenance
        run: node --test scripts/expression-assistance-traffic.test.mjs

      # Fixed seeds catch order-dependent tests deterministically: a PR that introduces one fails on
      # every run, never at random on a later PR (#512).
      - name: Unit tests (Workflows, shuffled)
        working-directory: src/essentials/Elsa.Studio.Workflows/Client
        env:
          SHUFFLE_SEEDS: "1 11 29"
        run: |
          for seed in $SHUFFLE_SEEDS; do
            echo "::group::Shuffle seed $seed"
            if ! pnpm exec vitest run --sequence.shuffle --sequence.seed="$seed"; then
              echo "::endgroup::"
              echo "::error::Order-dependent test failure on shuffle seed $seed. Reproduce locally with: pnpm --filter @elsa-workflows/studio-workflows exec vitest run --sequence.shuffle --sequence.seed=$seed"
              exit 1
            fi
            echo "::endgroup::"
          done

      - name: Check Workflows bundle budget
        run: pnpm check:bundle:workflows

  browser-tests:
    name: Browser tests (Chromium)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # pnpm version comes from the "packageManager" field in package.json.

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser tests
        run: pnpm test:browser

  expression-normal-host:
    name: Expression normal hosts (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      ELSA_FOUNDATION_WORKTREE: ${{ github.workspace }}/.normal-host-foundation
    steps:
      - name: Checkout Studio at the tested head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Read the immutable paired Foundation revision
        id: foundation-revision
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";
          const { revision } = JSON.parse(readFileSync(".github/expression-foundation.json", "utf8"));
          if (typeof revision !== "string" || !/^[0-9a-f]{40}$/.test(revision))
            throw new Error("Foundation revision must be an immutable full SHA");
          appendFileSync(process.env.GITHUB_OUTPUT, `revision=${revision}\n`);
          NODE

      - name: Checkout the paired Foundation checkpoint
        uses: actions/checkout@v4
        with:
          repository: elsa-workflows/elsa-foundation
          # Program #2310 delivery pins the refreshed integrated producer source.
          # The runtime-parity guard reads the same manifest; historical pins stay in the evidence.
          ref: ${{ steps.foundation-revision.outputs.revision }}
          path: .normal-host-foundation
          persist-credentials: false

      - name: Record exact source revisions
        run: |
          git rev-parse HEAD
          git -C "$ELSA_FOUNDATION_WORKTREE" rev-parse HEAD

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Prove Foundation persisted-host request envelopes
        working-directory: .normal-host-foundation
        run: >-
          dotnet test tests/essentials/Workbench/Tests/Elsa.Workbench.Tests.csproj -c Release
          -p:RestoreLockedMode=true --filter FullyQualifiedName~ExpressionToolingHostEvidenceTests
          --logger "console;verbosity=normal"

      - name: Run real persisted-host expression gate
        # The dedicated setup builds both actual applications from these checkouts. Each variant
        # owns fresh SQLite/configuration and only its own child processes; traces remain off.
        run: pnpm test:browser:expression-normal-host

      - name: Prove actual formatter production-runtime parity
        run: pnpm test:expression-formatting:parity

      - name: Build the paired Workbench for the owned REST journey
        working-directory: .normal-host-foundation
        run: dotnet build src/apps/Elsa.Workbench/Elsa.Workbench.csproj -c Debug -p:RestoreLockedMode=true

      - name: Prove JavaScript expressions through fresh HTTP and persistence
        shell: pwsh
        env:
          EXPECTED_FOUNDATION_REVISION: ${{ steps.foundation-revision.outputs.revision }}
        run: |
          $ErrorActionPreference = 'Stop'
          $foundation = $env:ELSA_FOUNDATION_WORKTREE
          $revision = & git -C $foundation rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $revision -cne $env:EXPECTED_FOUNDATION_REVISION) {
            throw 'The REST producer must match the immutable paired Foundation revision.'
          }
          Write-Host "REST producer revision: $revision"
          . "$foundation/e2e-tests/_ServerLifecycle.ps1"
          $serverBaseUrl = Resolve-ElsaServerBaseUrl
          $contentRoot = New-ElsaContentRoot -Prefix 'elsa-expression-js-rest'
          $ownedProcess = $null
          try {
            Start-OwnedElsaServer -BaseUrl $serverBaseUrl -ContentRoot $contentRoot
            $ownedProcess = $script:OwnedElsaServer.Process
            . "$foundation/e2e-tests/javascript/Test-JavaScriptExpressions.ps1" -BaseUrl $serverBaseUrl
            if ($cases.Count -ne 10 -or $pass -ne $cases.Count) {
              throw "JavaScript REST gate failed: $pass/$($cases.Count) cases passed; expected 10."
            }
          } finally {
            if (-not $ownedProcess -and $script:OwnedElsaServer) {
              $ownedProcess = $script:OwnedElsaServer.Process
            }
            Remove-OwnedElsaServer -ContentRoot $contentRoot -KeepContentRoot
            if ($ownedProcess -and -not $ownedProcess.HasExited) {
              throw 'The owned REST server did not exit during cleanup.'
            }
            Assert-PortFree -Port (Get-ElsaServerPort -BaseUrl $serverBaseUrl)
          }
          Write-Host 'All 10 REST cases passed; the owned process exited and its port is free.'
          # The final successful free-port probe uses lsof, whose no-listener result is 1.
          # All suite/ownership assertions above must succeed before declaring shell success.
          exit 0
