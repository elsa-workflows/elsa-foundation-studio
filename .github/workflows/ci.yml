name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel superseded runs for the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ESLint) + Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # pnpm version comes from the "packageManager" field in package.json.

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        # Every workspace package's vitest suite; the Workflows suite includes the module CSS contract test.
        # One package at a time, so the Workflows suite does not compete with the others for the runner's cores.
        run: pnpm --recursive --workspace-concurrency=1 test

      # Fixed seeds catch order-dependent tests deterministically: a PR that introduces one fails on
      # every run, never at random on a later PR (#512).
      - name: Unit tests (Workflows, shuffled)
        working-directory: src/essentials/Elsa.Studio.Workflows/Client
        env:
          SHUFFLE_SEEDS: "1 11 29"
        run: |
          for seed in $SHUFFLE_SEEDS; do
            echo "::group::Shuffle seed $seed"
            if ! pnpm exec vitest run --sequence.shuffle --sequence.seed="$seed"; then
              echo "::endgroup::"
              echo "::error::Order-dependent test failure on shuffle seed $seed. Reproduce locally with: pnpm --filter @elsa-workflows/studio-workflows exec vitest run --sequence.shuffle --sequence.seed=$seed"
              exit 1
            fi
            echo "::endgroup::"
          done

      - name: Check Workflows bundle budget
        run: pnpm check:bundle:workflows

  browser-tests:
    name: Browser tests (Chromium)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # pnpm version comes from the "packageManager" field in package.json.

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser tests
        run: pnpm test:browser

  expression-normal-host:
    name: Expression normal hosts (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      ELSA_FOUNDATION_WORKTREE: ${{ github.workspace }}/.normal-host-foundation
    steps:
      - name: Checkout Studio at the tested head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Checkout the paired Foundation checkpoint
        uses: actions/checkout@v4
        with:
          repository: elsa-workflows/elsa-foundation
          # Program #2310 M1 is stacked across repositories. Keep the paired, reviewed source
          # immutable until Foundation #2373 ships; main does not yet compose Liquid.
          ref: f81be4beed6973378eb678b2327d789c19d8095e
          path: .normal-host-foundation
          persist-credentials: false

      - name: Record exact source revisions
        run: |
          git rev-parse HEAD
          git -C "$ELSA_FOUNDATION_WORKTREE" rev-parse HEAD

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Prove Foundation persisted-host request envelopes
        working-directory: .normal-host-foundation
        run: >-
          dotnet test tests/essentials/Workbench/Tests/Elsa.Workbench.Tests.csproj -c Release
          -p:RestoreLockedMode=true --filter FullyQualifiedName~ExpressionToolingHostEvidenceTests
          --logger "console;verbosity=normal"

      - name: Run real persisted-host expression gate
        # The dedicated setup builds both actual applications from these checkouts. Each variant
        # owns fresh SQLite/configuration and only its own child processes; traces remain off.
        run: pnpm test:browser:expression-normal-host
